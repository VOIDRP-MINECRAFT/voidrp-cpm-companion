name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Gradle build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Neutralize local dev proxy (CI only)
        run: '[ -f gradle.properties ] && sed -i "/[Pp]roxy/d" gradle.properties || true'

      - name: Build
        run: ./gradlew build --stacktrace --no-daemon

      - name: Upload jars
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: jars
          path: '**/build/libs/*.jar'
          if-no-files-found: warn
          retention-days: 14

      # A tag like v1.2.0 publishes the built jars as a GitHub release, so the server
      # owner downloads a file instead of building one.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true
